name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/recovery-thursday-build
      - feature/autopilot-foundation

permissions:
  contents: read

jobs:
  build:
    name: Build GLOBAL TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 no longer requests the retired Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: GLOBAL-TV-Premium-5.0
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            set +e
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
            build_status=${PIPESTATUS[0]}
            set -e

            if [ "${build_status}" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eqi 'HTTP 429|status code 429|Too Many Requests' /tmp/gradle-build.log; then
              echo "Build failed for a reason other than a Maven Central rate limit; stopping retries."
              exit "${build_status}"
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Maven Central rate limit detected; waiting 25 seconds before retry."
              sleep 25
            fi
          done

          echo "Build still blocked by Maven Central rate limiting after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: global-tv-debug-apk
          path: GLOBAL-TV-Premium-5.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
